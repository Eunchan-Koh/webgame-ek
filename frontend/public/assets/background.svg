  <rect x="1170" y="320" width="280" height="140" fill="#4a2c18"/>
  <rect x="1170" y="480" width="280" height="120" fill="#4a2c18"/>
  <g>
    <rect x="1180" y="190" width="30" height="110" fill="#a33"/>
    <rect x="1215" y="200" width="25" height="100" fill="#36a"/>
    <rect x="1245" y="180" width="35" height="120" fill="#3a6"/>
    <rect x="1290" y="350" width="30" height="110" fill="#c93"/>
    <rect x="1325" y="360" width="28" height="100" fill="#639"/>
