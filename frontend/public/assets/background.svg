  <!-- sofa -->
  <rect x="160" y="500" width="460" height="160" rx="30" fill="#4f6d8f"/>
  <rect x="130" y="470" width="70" height="200" rx="25" fill="#3f5a78"/>
  <rect x="580" y="470" width="70" height="200" rx="25" fill="#3f5a78"/>
