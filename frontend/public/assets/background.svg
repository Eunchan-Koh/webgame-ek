<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- placeholder room -->
  <rect width="1600" height="620" fill="#c9b79c"/>
  <g stroke="#b8a586" stroke-width="2">
    <line x1="0" y1="120" x2="1600" y2="120"/>
    <line x1="0" y1="240" x2="1600" y2="240"/>
    <line x1="0" y1="360" x2="1600" y2="360"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
  </g>
  <rect y="620" width="1600" height="280" fill="#8a5a3b"/>
